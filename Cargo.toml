[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parser-utils",
    "crates/parser-markdown",
    "crates/parser-asciidoc",
    "crates/parser-rst",
    "crates/parser-latex",
    "crates/parser-verso",
    "crates/parsers",
    "crates/assemble",
    "crates/translate",
    "crates/cli",
    "crates/server",
]
default-members = ["crates/cli"]
# rust-forge의 blacksmith 전처리기는 build/tree 아래로 복제되는 독립 Cargo
# 프로젝트라 이 워크스페이스의 멤버가 아닙니다.
exclude = ["projects/rust-forge/build/tree/blacksmith"]
