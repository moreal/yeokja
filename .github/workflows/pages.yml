# 번역 프로젝트들을 GitHub Pages로 배포합니다.
#
# 번역은 CI에서 일어나지 않습니다: 커밋된 state/에서 출력을 재구성만 하고
# (완역 상태라 provider 호출이 0회), `status --check`가 미번역 세그먼트를
# 발견하면 영어 문장이 섞인 판을 조용히 배포하는 대신 실패합니다.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # contributors 표가 git 히스토리 전체를 요구합니다. actions/checkout이
      # 서브모듈을 얕게 받았을 때만 --unshallow가 의미가 있고, 아니면 no-op.
      # theBeamBook만 풉니다 — pypy 히스토리는 크고 여기서는 필요 없습니다.
      - name: Unshallow theBeamBook for the contributors table
        run: git -C projects/thebeambook/upstream fetch --unshallow || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install the Asciidoctor toolchain
        run: gem install asciidoctor asciidoctor-diagram rouge

      - name: Build yeokja
        run: cargo build --release -p yeokja-cli

      # PyPy 문서의 conf.py는 py2 문법인 pypy.config를 임포트하므로 공식
      # 환경(.readthedocs.yaml)과 같은 Python 2.7이 필요합니다.
      - name: Install Python 2.7 for the PyPy docs
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy2.7'

      - name: Install the PyPy docs Sphinx toolchain
        run: pip install 'sphinx<2' 'docutils==0.11' 'sphinx-issues==1.2.0' 'sphinx_rtd_theme<1' py sphinx-affiliates

      # FP in Lean은 빌드 중 Python 출력을 책에 포함하므로 upstream CI와 같은
      # 버전을 사용합니다. 앞서 설치한 Sphinx 실행 파일은 PyPy 2.7 shebang을
      # 유지하므로 이후 Python 기본값을 바꿔도 PyPy 문서 빌드에는 영향이 없습니다.
      - name: Install Python for FP in Lean
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.4'

      # upstream fp-lean CI와 같은 방식으로 elan을 설치합니다. book과 examples는
      # 서로 다른 lean-toolchain을 가지며, 첫 lean 호출이 각각을 설치합니다.
      - name: Install elan for FP in Lean
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install FP in Lean toolchains
        run: |
          (cd projects/fp-lean/upstream/examples && lean --version)
          (cd projects/fp-lean/upstream/book && lean --version)

      # 상태 파일이 있는 문서만 재구성·검사합니다. 상태가 없는 문서는 영어
      # 원문 그대로 트리에 남는 것이 의도된 동작이고(부분 번역 프로젝트),
      # 상태 파일 단위로 돌기 때문에 CI가 provider를 부를 일도 없습니다.
      - name: Rebuild translated sources from committed state
        run: |
          for project in projects/*/; do
            (
              cd "$project"
              for s in $(find state -name '*.yeokja.json'); do
                src="${s#state/}"; src="${src%.yeokja.json}"
                ../../target/release/yeokja translate "$src"
                ../../target/release/yeokja status --check "$src"
              done
            )
          done

      # Pages에 실릴 프로젝트는 [build.html] 타깃으로 HTML을 dist/site에
      # 내놓습니다. 소스 수집 절차만 담은 recipe-only 프로젝트는 건너뜁니다.
      - name: Build every deployable project's HTML
        run: |
          for project in projects/*/; do
            if ! grep -q '^\[build\.html\]' "$project/yeokja.toml"; then
              echo "Skipping $project (no [build.html] target)"
              continue
            fi
            (cd "$project" && ../../target/release/yeokja build html)
          done

      - name: Stage the Pages tree
        run: |
          mkdir -p _site
          cp -r projects/thebeambook/dist/site _site/theBeamBook
          cp -r projects/pypy/dist/site _site/pypy
          cp -r projects/pypy/dist/rpython-site _site/rpython
          cp -r projects/fp-lean/dist/site _site/fp-lean
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>yeokja 번역 프로젝트</title>
          <body style="font-family: sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem;">
          <h1>yeokja 번역 프로젝트</h1>
          <ul>
            <li><a href="theBeamBook/">The BEAM Book 한국어판</a>
              — 원문 <a href="https://github.com/happi/theBeamBook">happi/theBeamBook</a> (CC BY 4.0)</li>
            <li><a href="pypy/">PyPy 문서 한국어판</a>
              — 원문 <a href="https://github.com/pypy/pypy">pypy/pypy</a> (MIT)</li>
            <li><a href="rpython/">RPython 문서 한국어판</a>
              — 원문 <a href="https://github.com/pypy/pypy">pypy/pypy</a>의 rpython/doc (MIT)</li>
            <li><a href="fp-lean/">Functional Programming in Lean 한국어판</a>
              — 원문 <a href="https://lean-lang.org/functional_programming_in_lean/">Functional Programming in Lean</a> (CC BY 4.0)</li>
          </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
