# 번역 프로젝트들을 GitHub Pages로 배포합니다.
#
# 번역은 CI에서 일어나지 않습니다: 커밋된 state/에서 출력을 재구성만 하고
# (완역 상태라 provider 호출이 0회), `status --check`가 미번역 세그먼트를
# 발견하면 영어 문장이 섞인 판을 조용히 배포하는 대신 실패합니다. 이 재구성은
# 그래도 build html 전에 필요합니다: 재구성 결과인 ko/는 gitignore되어 있고,
# assemble은 ko/가 없으면 에러 없이 "빈 오버레이"로 취급해 영어 원본만 있는
# 사이트를 조용히 만들어 버리기 때문입니다.
#
# 프로젝트마다 필요한 툴체인이 달라서(PyPy는 Python 2.7+Sphinx, theBeamBook은
# Ruby+Asciidoctor, Lean 서적은 elan 또는 Python+Sphinx, Napkin은 Nix+LaTeXML)
# 프로젝트별로 잡을 나눠 병렬로
# 돌리고, Napkin의 HTML·EPUB·PDF도 각각 별도 잡에서 병렬로 빌드합니다. 각 잡은 자기
# 프로젝트와 타깃에 필요한 툴체인만 설치합니다. pypy-eu-reports는
# state/가 통째로 gitignore(라이선스 미확정, README 참조)라 커밋된 상태가 없고
# [build.html] 타깃도 없어 CI에서 할 일이 없으므로 matrix에서 뺍니다.
#
# 새 배포 프로젝트나 타깃을 추가하면 아래 rebuild 잡의 matrix.include와 stage 잡의
# 스테이징 스텝에 각각 항목을 추가해야 합니다.
name: Deploy Pages

# 신뢰할 수 있는 main push와 수동 실행만 ARC self-hosted runner에서 처리합니다.
# pull_request 검증은 pr.yml의 GitHub-hosted runner에서 별도로 실행합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-cli:
    runs-on: "<RUNNER_LABEL>"
    container: mcr.microsoft.com/devcontainers/universal:6.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build yeokja
        run: cargo build --release -p yeokja-cli

      - name: Upload yeokja binary
        uses: actions/upload-artifact@v4
        with:
          name: yeokja-cli
          path: target/release/yeokja
          retention-days: 1

  rebuild:
    needs: build-cli
    runs-on: "<RUNNER_LABEL>"
    container: mcr.microsoft.com/devcontainers/universal:6.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: pypy
            target: html
            toolchain: python2
            artifact: dist-pypy
            artifact_path: projects/pypy/dist
          - project: thebeambook
            target: html
            toolchain: ruby
            unshallow: true
            artifact: dist-thebeambook
            artifact_path: projects/thebeambook/dist
          - project: fp-lean
            target: html
            toolchain: lean
            artifact: dist-fp-lean
            artifact_path: projects/fp-lean/dist
          - project: tpil
            target: html
            toolchain: lean
            artifact: dist-tpil
            artifact_path: projects/tpil/dist
          - project: mil
            target: html
            toolchain: python3-mil
            artifact: dist-mil
            artifact_path: projects/mil/dist
          - project: peps
            target: html
            toolchain: python3-peps
            artifact: dist-peps
            artifact_path: projects/peps/dist
          - project: napkin
            target: html
            toolchain: nix
            artifact: dist-napkin-html
            artifact_path: projects/napkin/dist
          - project: napkin
            target: epub
            toolchain: nix
            artifact: dist-napkin-epub
            artifact_path: projects/napkin/output/epub
          - project: napkin
            target: pdf
            toolchain: nix
            artifact: dist-napkin-pdf
            artifact_path: projects/napkin/output/pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이 잡이 다루는 프로젝트의 submodule만 받습니다 — 다른 두 프로젝트의
      # upstream(수백 MB)까지 받을 이유가 없습니다.
      - name: Fetch this project's submodule
        run: git submodule update --init --depth 1 projects/${{ matrix.project }}/upstream

      # contributors 표가 git 히스토리 전체를 요구합니다. actions/checkout이
      # submodule을 얕게 받았을 때만 --unshallow가 의미가 있고, 아니면 no-op.
      - name: Unshallow this project's submodule for the contributors table
        if: matrix.unshallow
        run: git -C projects/${{ matrix.project }}/upstream fetch --unshallow || true

      - name: Download yeokja binary
        uses: actions/download-artifact@v4
        with:
          name: yeokja-cli
          path: target/release

      - name: Make yeokja executable
        run: chmod +x target/release/yeokja

      # PyPy 문서의 conf.py는 py2 문법인 pypy.config를 임포트하므로 공식
      # 환경(.readthedocs.yaml)과 같은 Python 2.7이 필요합니다.
      - name: Install Python 2.7 for the PyPy docs
        if: matrix.toolchain == 'python2'
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy2.7'

      - name: Install the PyPy docs Sphinx toolchain
        if: matrix.toolchain == 'python2'
        run: pip install 'sphinx<2' 'docutils==0.11' 'sphinx-issues==1.2.0' 'sphinx_rtd_theme<1' py sphinx-affiliates

      - name: Install Python 3
        if: matrix.toolchain == 'python3-mil' || matrix.toolchain == 'python3-peps'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Mathematics in Lean Sphinx toolchain
        if: matrix.toolchain == 'python3-mil'
        run: pip install -r projects/${{ matrix.project }}/upstream/scripts/requirements.txt

      - name: Install the PEPs Sphinx toolchain
        if: matrix.toolchain == 'python3-peps'
        run: pip install -r projects/${{ matrix.project }}/upstream/requirements.txt

      - name: Install Ruby
        if: matrix.toolchain == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install the Asciidoctor toolchain
        if: matrix.toolchain == 'ruby'
        run: gem install asciidoctor asciidoctor-diagram rouge

      - name: Install Nix for the Napkin build
        if: matrix.toolchain == 'nix'
        uses: cachix/install-nix-action@v31

      # Sphinx의 graphviz 확장과 asciidoctor-diagram 둘 다 다이어그램을
      # 렌더링하려면 dot 바이너리가 있어야 합니다. 없으면 빌드가 실패하는 대신
      # 경고만 남기고 다이어그램 원본 텍스트를 그대로 페이지에 삽입해버려서,
      # 깨진 결과물이 조용히 배포되는 문제가 있었습니다.
      #
      # 번역된 다이어그램은 노드 라벨이 한글이라 dot이 PNG로 래스터라이즈할 때
      # (RPython translation.rst의 digraph처럼) CI 러너에 한글 글리프가 있는
      # 폰트가 없으면 글자가 네모(tofu)로 깨져서 그대로 이미지에 구워집니다.
      # fonts-noto-cjk를 같이 깔아야 fontconfig가 Sans-Serif 요청을 한글이
      # 있는 폰트로 대체합니다.
      - name: Install Graphviz
        if: matrix.toolchain == 'python2' || matrix.toolchain == 'ruby'
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      # FP in Lean은 빌드 중 Python 출력을 책에 포함하므로 upstream CI와 같은
      # 버전을 사용합니다. 같은 Lean 잡인 TPiL에도 일관된 Python을 제공합니다.
      - name: Install Python for the Lean books
        if: matrix.toolchain == 'lean'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.4'

      # upstream Lean 책 CI와 같은 방식으로 elan을 설치합니다. book과 examples는
      # 서로 다른 lean-toolchain을 가지며, 첫 lean 호출이 각각을 설치합니다.
      - name: Install elan for the Lean books
        if: matrix.toolchain == 'lean'
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Lean book toolchains
        if: matrix.toolchain == 'lean'
        run: |
          (cd projects/${{ matrix.project }}/upstream/examples && lean --version)
          (cd projects/${{ matrix.project }}/upstream/book && lean --version)

      - name: Rebuild translated sources from committed state
        if: matrix.project != 'peps'
        run: |
          cd projects/${{ matrix.project }}
          for s in $(find state -name '*.yeokja.json'); do
            src="${s#state/}"; src="${src%.yeokja.json}"
            ../../target/release/yeokja translate "$src"
            ../../target/release/yeokja status --check "$src"
          done

      # PEP는 루트 문서와 appendices를 여러 source 규칙으로 다룹니다. 프로젝트
      # 전체를 한 번에 확인해야 새 PEP가 state 없이 빠지는 경우도 배포를 막습니다.
      - name: Rebuild and verify all translated PEP sources
        if: matrix.project == 'peps'
        run: |
          cd projects/${{ matrix.project }}
          ../../target/release/yeokja translate upstream/peps
          ../../target/release/yeokja status --check upstream/peps

      - name: Build ${{ matrix.target }}
        run: |
          cd projects/${{ matrix.project }}
          ../../target/release/yeokja build ${{ matrix.target }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1

  stage:
    needs: rebuild
    runs-on: "<RUNNER_LABEL>"
    container: mcr.microsoft.com/devcontainers/universal:6.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built sites
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      - name: Stage the Pages tree
        run: |
          mkdir -p _site
          cp -r artifacts/dist-thebeambook/site _site/theBeamBook
          cp -r artifacts/dist-pypy/site _site/pypy
          cp -r artifacts/dist-pypy/rpython-site _site/rpython
          cp -r artifacts/dist-fp-lean/site _site/fp-lean
          cp -r artifacts/dist-tpil/site _site/tpil
          cp -r artifacts/dist-mil/site _site/mil
          cp -r artifacts/dist-peps/site _site/peps
          cp -r artifacts/dist-napkin-html/site _site/napkin
          cp artifacts/dist-napkin-pdf/Napkin-ko.pdf _site/napkin/
          cp artifacts/dist-napkin-epub/Napkin-ko.epub _site/napkin/
          cp site/index.html site/favicon.svg _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: stage
    runs-on: "<RUNNER_LABEL>"
    container: mcr.microsoft.com/devcontainers/universal:6.1-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
