# Rust Forge 용어집
#
# 릴리스 채널 이름(stable, beta, nightly)은 영어 원문 그대로 둡니다.
# Rust 커뮤니티와 채널 인프라(`channel-rust-*.toml`, `rustup toolchain install
# nightly`, `beta-nominated` 레이블 등)가 이 이름들을 그대로 쓰기 때문에,
# 번역하면 문서와 실제 도구 사용법이 어긋납니다. 같은 이유로 도구·봇·서비스
# 이름(rustc, cargo, rustup, bors, triagebot, crates.io, docs.rs, toolstate 등)도
# 그대로 둡니다. 이 규칙은 translation 값을 원문과 동일하게 두는 방식으로
# 표현합니다(yeokja 용어집에는 별도의 "번역하지 않음" 필드가 없습니다).
#
# 반대로 channel/release 같은 일반 명사는 평소대로 번역합니다.
# "release channel"은 "릴리스 채널", "release notes"는 "릴리스 노트"입니다.

