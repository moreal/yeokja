[project]
source_lang = "en"
target_lang = "ko"
# PyPy 본체 프로젝트와 용어 정책을 공유합니다 (경로는 -C로 지정한 프로젝트
# 디렉터리 기준). EU Report에만 필요한 용어도 이 공유 파일에 더하되, pypy
# 문서에 이미 등장하는 단어(sprint, consortium 등)를 새로 추가하면 완역된
# pypy 프로젝트가 GlossaryStale로 재번역 대상이 되므로 추가 전에 upstream을
# grep해서 확인합니다.
glossary = "../pypy/glossary.toml"
state_dir = "state"

# 소스는 scripts/fetch-and-convert.sh가 생성합니다 (커밋하지 않음 — README의
# 라이선스 절 참조). <!-- Page N --> 마커는 HTML 블록이라 번역 대상 밖이고
# 재구성 시 그대로 보존됩니다.
[[sources]]
path = "source/"
pattern = "*.md"
parser = "markdown"
output = "ko/{path}"

# 기본 포트(3000)는 다른 프로젝트의 서버와 겹치는 일이 잦아 비켜 둡니다.
[server]
port = 3210

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
max_retries = 3

[translation]
concurrency = 8

# 12쪽 연락처 표에는 [[tables]] 규칙을 쓰지 않습니다 — Markdown 파서는 셀에
# TableCell role을 달지 않아 규칙이 적용되지 않습니다 (AsciiDoc/RST 전용).
# 연락처 열의 이름·이메일·URL은 번역 프롬프트와 링크 평가기가 보존합니다.
