[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
# 원본은 읽기 전용 submodule이므로 상태 파일을 밖으로 분리합니다.
state_dir = "state"

[[sources]]
path = "upstream/chapters/"
pattern = "**/*.asciidoc"
parser = "asciidoc"
output = "ko/chapters/{path}"

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
max_retries = 3

[translation]
concurrency = 8

# Reference tables: identifier columns stay as-is, prose columns get translated.
# Run `yeokja inspect ./upstream/chapters/` to see how these apply.

[[tables]]
headers = ["Instruction", "Arguments", "Explanation"]
translate = ["Explanation"]

[[tables]]
headers = ["Type", "Explanation"]
translate = ["Explanation"]

[[tables]]
headers = ["Name", "Description", "C-name", "Type-name", "Flag"]
translate = ["Name", "Description"]

[[tables]]
headers = ["CPU register", "Name", "Purpose"]
translate = ["Purpose"]

[[tables]]
headers = ["Value", "Effect"]
translate = ["Effect"]
