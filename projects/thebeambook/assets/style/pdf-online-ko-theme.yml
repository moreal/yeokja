# Korean edition of the A4 online theme.
#
# The only change from pdf-online is a Hangul fallback. Prawn picks a font per
# glyph and falls through this list for anything the primary font lacks, so
# Latin keeps Noto Serif — and its real italics, which Nanum Gothic does not
# have — while Hangul comes from Nanum Gothic. Code blocks keep Hack for the
# same reason: the fallback is global, so Hangul inside a listing still renders.
extends: pdf-online

font:
  catalog:
    merge: true
    Nanum Gothic:
      normal:      nanumgothic/NanumGothic-Regular.ttf
      italic:      nanumgothic/NanumGothic-Regular.ttf
      bold:        nanumgothic/NanumGothic-Bold.ttf
      bold_italic: nanumgothic/NanumGothic-Bold.ttf
  fallbacks:
    - Nanum Gothic
    # pdf-theme.yml dropped the default theme's `fallbacks: [M+ 1mn]` while
    # keeping M+ 1mn in the catalog, so callout numbers (①②③, U+2460…) have
    # nowhere to come from: the Noto Serif subset maps them to .notdef and they
    # print as empty boxes. The English PDF has the same holes.
    - M+ 1mn

# Hangul has no inter-word spaces to stretch, so justified text opens rivers
# and stretched gaps at the few spaces a line does have.
base:
  align: left
