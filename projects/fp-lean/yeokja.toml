[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
# 원본 서브모듈은 읽기 전용으로 두고 번역 상태를 프로젝트에 보관합니다.
state_dir = "state"

# 최상위 책 진입점.
[[sources]]
path = "upstream/book"
pattern = "FPLean.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/{path}"

# 장 진입점과 독립된 짧은 장은 FPLean 바로 아래에 있습니다.
[[sources]]
path = "upstream/book/FPLean"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/{path}"

# 하위 절 원고. 코드만 담은 FPLean/Examples 트리는 소스에서 제외합니다.
[[sources]]
path = "upstream/book/FPLean/DependentTypes"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/DependentTypes/{path}"

[[sources]]
path = "upstream/book/FPLean/FunctorApplicativeMonad"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/FunctorApplicativeMonad/{path}"

[[sources]]
path = "upstream/book/FPLean/GettingToKnow"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/GettingToKnow/{path}"

[[sources]]
path = "upstream/book/FPLean/HelloWorld"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/HelloWorld/{path}"

[[sources]]
path = "upstream/book/FPLean/MonadTransformers"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/MonadTransformers/{path}"

[[sources]]
path = "upstream/book/FPLean/Monads"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/Monads/{path}"

[[sources]]
path = "upstream/book/FPLean/ProgramsProofs"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/ProgramsProofs/{path}"

[[sources]]
path = "upstream/book/FPLean/TypeClasses"
pattern = "*.lean"
parser = "verso"
parser_manifest = "verso-spans.json"
output = "ko/book/FPLean/TypeClasses/{path}"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

# Verso가 빌드 중 갱신하는 추적 JSON은 base 심링크를 따라 쓰지 않도록 먼저
# 실파일로 만듭니다. 원문 서브모듈은 빌드 뒤에도 clean 상태여야 합니다.
[[derive.step]]
kind = "generate"
command = '''
set -e
for file in book/.verso/*.json; do
  if [ -L "$file" ]; then
    cp -L "$file" "$file.yeokja-copy"
    mv "$file.yeokja-copy" "$file"
  fi
done
'''

# CC BY 4.0이 요구하는 원저작자 표시와 변경 사실을 완성된 책에도 둡니다.
[[derive.step]]
kind = "patch"
file = "patches/attribution.patch"

[build.html]
command = '''
set -e
cd book
lake exe fp-lean
cd ..
mv book/_out/html-multi site
'''
outputs = ["site"]

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
max_retries = 3

[translation]
concurrency = 8
