[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
# 원본은 읽기 전용 submodule이므로 상태 파일을 밖으로 분리합니다.
state_dir = "state"

[[sources]]
path = "upstream/pypy/doc/"
pattern = "**/*.rst"
parser = "rst"
output = "ko/pypy/doc/{path}"

[derive]
base = "upstream"

# 번역 미러: 원본이 사라진 번역(고아)은 트리에 얹지 않고 보고합니다.
[[derive.overlay]]
path = "ko"
require_base = true

# conf.py의 pypyconfig 확장이 rpython 패키지를 임포트하고, 그 임포트가
# 플랫폼 프로브(.o 컴파일)를 발동하며 소스 루트를 realpath로 검증합니다.
# 링크 트리는 upstream으로 리졸브되어 그 단언이 깨지므로, rpython만
# 실사본으로 구체화합니다 — 프로브 산출물도 트리 안에 떨어집니다.
[[derive.step]]
kind = "generate"
command = 'rm -rf rpython && cp -RL "$YEOKJA_ROOT/upstream/rpython" rpython'

# 문서 빌드는 Sphinx이며 공식 환경이 Python 2.7입니다(.readthedocs.yaml).
# brew의 pypy(2.7) 기반 virtualenv에 sphinx<2, docutils==0.11,
# sphinx-issues==1.2.0, sphinx_rtd_theme<1, py를 설치하고 그 bin을 PATH에
# 얹어 실행합니다.
[build]
command = 'make -C pypy/doc html'
outputs = ["pypy/doc/_build/html"]

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
max_retries = 3

[translation]
concurrency = 8
