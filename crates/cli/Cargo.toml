[package]
name = "yeokja-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yeokja"
path = "src/main.rs"

[dependencies]
yeokja-core = { path = "../core" }
yeokja-parsers = { path = "../parsers" }
yeokja-translate = { path = "../translate" }
yeokja-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
