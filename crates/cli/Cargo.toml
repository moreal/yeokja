[package]
name = "yeokja-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yeokja"
path = "src/main.rs"

[dependencies]
yeokja-core = { path = "../core" }
yeokja-parser-markdown = { path = "../parser-markdown" }
yeokja-parser-asciidoc = { path = "../parser-asciidoc" }
yeokja-translate = { path = "../translate" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
glob = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
