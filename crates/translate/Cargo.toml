[package]
name = "yeokja-translate"
version = "0.1.0"
edition = "2024"

[dependencies]
yeokja-core = { path = "../core" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
